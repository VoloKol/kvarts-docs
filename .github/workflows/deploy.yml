name: docs-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VALE_VERSION: "3.27.0"
  MARKDOWNLINT_VERSION: "0.24.1"

jobs:
  lint-markdown:
    name: markdownlint-cli2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx -y markdownlint-cli2@${{ env.VALE_VERSION }} "**/*.md" "#node_modules"

  lint-vale:
    name: Vale (стиль KB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установка Vale ${{ env.VALE_VERSION }}
        run: |
          mkdir -p vale-bin
          curl -sL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | tar xz -C vale-bin
          ./vale-bin/vale --version
      - name: Проверка Vale
        run: vale --config .vale.ini .

  build:
    name: Сборка Diplodoc
    runs-on: ubuntu-latest
    needs: [lint-markdown, lint-vale]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Деплой на GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
